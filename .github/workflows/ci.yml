name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt && pip install .
      - name: Byte-compile and import
        run: |
          python -m compileall -q paypalpayoutssdk tests
          python -c "import paypalpayoutssdk.payouts"
